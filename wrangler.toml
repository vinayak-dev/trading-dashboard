name = "notion-trading-dashboard"
main = "worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Production Worker secrets and variables:
# Set your server-side secret using Wrangler CLI:
#   npx wrangler secret put NOTION_TOKEN
#
# Set environment variables (or secrets):
#   npx wrangler secret put NOTION_DATABASE_ID
# (or NOTION_DATA_SOURCE_ID)
#
# For local Worker development:
#   npm run worker:dev
# (reads secrets from .dev.vars)
